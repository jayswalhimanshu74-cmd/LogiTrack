spring.application.name=Inventory-Management-System

# Import local sensitive properties file if it exists
spring.config.import=optional:classpath:example.properties

#============================================
# SERVER CONFIG
# ============================================
server.port=${PORT:8080}
# ============================================
# DATABASE CONFIG (PostgreSQL - pgAdmin)
# ============================================

# Replace 'inventory_db' with your actual DB name created in pgAdmin
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================
# JPA / HIBERNATE CONFIG
# ============================================
# validate = safest once tables exist (use 'update' only while actively prototyping)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==================================

# ============================================
# JWT CONFIG (used by JwtService)
# ============================================
# 256-bit+ secret ? replace with your own long random string, never commit the real one
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# 24 hours in ms. Adjust as needed (e.g. 3600000 = 1 hour for access token)

# ============================================
# MAIL CONFIGURATION (forgot password)
# ============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Password Reset & Verification URLs (Vite frontend)
app.reset-password-url=${RESET_PASSWORD_URL:https://inventory-managment-system-eta.vercel.app/reset-password}
app.verify-email-url=${VERIFY_EMAIL_URL:https://inventory-managment-system-eta.vercel.app/verify-email}
app.reset-token-expiration-minutes=15


# ============================================
# SPRINGDOC / SWAGGER UI CONFIG
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.persist-authorization=true
springdoc.packages-to-scan=com.example.sales.Inventory.Management.System
springdoc.paths-to-match=/api/**
