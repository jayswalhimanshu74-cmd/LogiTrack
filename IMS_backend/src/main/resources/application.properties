spring.application.name=Inventory-Management-System

# Import local sensitive properties file if it exists
spring.config.import=optional:classpath:example.properties

#============================================
# SERVER CONFIG
# ============================================
server.port=8080

# ============================================
# DATABASE CONFIG (PostgreSQL - pgAdmin)
# ============================================

# Replace 'inventory_db' with your actual DB name created in pgAdmin
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/IMS}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Him@1108}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================
# JPA / HIBERNATE CONFIG
# ============================================
# validate = safest once tables exist (use 'update' only while actively prototyping)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==================================

# ============================================
# JWT CONFIG (used by JwtService)
# ============================================
# 256-bit+ secret ? replace with your own long random string, never commit the real one
app.jwt.secret=${JWT_SECRET:14ed6ab4ce76e9061013efcd1da8320abb2197b321970d54ff243246ed3d8608}
app.jwt.expiration-ms=86400000
# 24 hours in ms. Adjust as needed (e.g. 3600000 = 1 hour for access token)

# ============================================
# MAIL CONFIGURATION (forgot password)
# ============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Password Reset URL (Vite frontend)
app.reset-password-url=${RESET_PASSWORD_URL:http://localhost:5173/reset-password}
app.reset-token-expiration-minutes=15

